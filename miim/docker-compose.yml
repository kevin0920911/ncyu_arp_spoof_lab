services:
  attacker:
    build: ./attacker
    container_name: mitm-attacker
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      lab:
        ipv4_address: 10.10.0.10
        mac_address: 00:00:00:00:00:10
    command: ["sleep", "infinity"]

  victim:
    build: ./victim
    container_name: mitm-victim
    cap_add:
      - NET_ADMIN
    networks:
      lab:
        ipv4_address: 10.10.0.20
        mac_address: 00:00:00:00:00:20
 
  server:
    build: ./server
    container_name: mitm-flag-server
    networks:
      lab:
        ipv4_address: 10.10.0.30
        mac_address: 00:00:00:00:00:30

  gateway:
    build: ./gateway
    container_name: mitm-gateway
    cap_add:
      - NET_ADMIN
    networks:
      lab:
        ipv4_address: 10.10.0.1
        mac_address: 00:00:00:00:00:01

networks:
  lab:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24